name: KSEL public validation suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-tests:
    name: schema-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validation dependency
        run: python -m pip install -r implementation/requirements-dev.txt

      - name: Run Profile A schema and reference-engine tests
        run: python -m unittest discover -s implementation/tests -p "test_*.py" -v

      - name: Run RN-008 prediction-schema and evaluator tests
        run: python -m unittest discover -s benchmark/evaluation -p "test_*.py" -v

      - name: Run release-governance validation tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
