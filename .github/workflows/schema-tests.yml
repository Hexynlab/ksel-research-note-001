name: KSEL schema validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-tests:
    name: schema-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validation dependency
        run: python -m pip install -r implementation/requirements-dev.txt

      - name: Run KSEL schema validation suite
        run: python -m unittest discover -s implementation/tests -p "test_profile_a_schema.py" -v
