name: KSEL public validation suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-tests:
    name: schema-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Scan full Git history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Install schema validation dependency
        run: python -m pip install -r implementation/requirements-dev.txt

      - name: Run Profile A schema and reference-engine tests
        run: python -m unittest discover -s implementation/tests -p "test_*.py" -v

      - name: Run RN-008 prediction-schema and evaluator tests
        run: python -m unittest discover -s benchmark/evaluation -p "test_*.py" -v

      - name: Run release-governance validation tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate current repository release metadata
        run: python scripts/validate_release.py --tag "v$(cat VERSION)"
