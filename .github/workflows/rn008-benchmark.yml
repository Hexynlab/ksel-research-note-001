name: RN-008 benchmark checks

on:
  push:
    paths:
      - "benchmark/**"
      - "implementation/requirements-dev.txt"
      - ".github/workflows/rn008-benchmark.yml"
  pull_request:
    paths:
      - "benchmark/**"
      - "implementation/requirements-dev.txt"
      - ".github/workflows/rn008-benchmark.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validation dependency
        run: python -m pip install -r implementation/requirements-dev.txt
      - name: Run evaluator and dataset tests
        run: python -m unittest discover -s benchmark/evaluation -p "test_*.py" -v
