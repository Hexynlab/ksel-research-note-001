name: KSEL Profile A contract checks

on:
  push:
    paths:
      - "implementation/**"
      - ".github/workflows/ksel-profile-a.yml"
  pull_request:
    paths:
      - "implementation/**"
      - ".github/workflows/ksel-profile-a.yml"

permissions:
  contents: read

jobs:
  profile-a-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install schema test dependency
        run: python -m pip install -r implementation/requirements-dev.txt
      - name: Validate Profile A contracts and reference engine
        run: python -m unittest discover -s implementation/tests -p "test_*.py" -v
