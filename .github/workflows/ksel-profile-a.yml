name: KSEL Profile A contract checks

on:
  push:
    paths:
      - "implementation/**"
      - ".github/workflows/ksel-profile-a.yml"
  pull_request:
    paths:
      - "implementation/**"
      - ".github/workflows/ksel-profile-a.yml"

permissions:
  contents: read

jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema test dependency
        run: python -m pip install -r implementation/requirements-dev.txt
      - name: Validate Profile A contracts
        run: python -m unittest discover -s implementation/tests -p "test_*.py" -v
